# Configuration template for Telegraf running CX-Radar QoE Probe in a hybrid model.
# Save this file to /etc/telegraf/telegraf.conf on Linux or C:\Program Files\Telegraf\telegraf.conf on Windows.

[global_tags]
  # Optional: custom tags to identify the host
  # host_tag = "remote-probe"

[agent]
  interval = "5m"              # Cadencia de ejecución de las pruebas QoE
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000   # Gran capacidad de buffer para caídas prolongadas de red (resiliencia)
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "ms"
  debug = false
  quiet = false
  logfile = ""                 # Dejar vacío para loggear al log del sistema (syslog/Windows Event Log) o especificar una ruta

# ------------------------------------------------------------------------------
# INPUTS
# ------------------------------------------------------------------------------

[[inputs.exec]]
  # Comando para ejecutar la sonda de Python en seco (skip-influx-write).
  # Nota: Reemplace python/python3 y las rutas absolutas según el sistema operativo:
  #
  # Para Windows (Ejemplo):
  # commands = ['python "C:\\CX-Radar\\scripts\\qoe_probe.py" --skip-influx-write --config-path "C:\\CX-Radar\\config\\probe-catalog.json"']
  #
  # Para Linux/macOS (Ejemplo):
  # commands = ["python3 /opt/cx-radar/scripts/qoe_probe.py --skip-influx-write --config-path /opt/cx-radar/config/probe-catalog.json"]
  
  commands = [
    "python3 /opt/cx-radar/scripts/qoe_probe.py --skip-influx-write"
  ]

  # Timeout máximo permitido para el script (debe ser mayor que el tiempo máximo que tardan los tests combinados)
  timeout = "4m30s"

  # Formato de entrada de los datos. La sonda de Python imprime en stdout formato Influx Line Protocol puro.
  data_format = "influx"

# ------------------------------------------------------------------------------
# OUTPUTS
# ------------------------------------------------------------------------------

[[outputs.influxdb_v2]]
  # Las URLs de destino de InfluxDB Cloud o InfluxDB OSS
  urls = ["https://us-east-1-1.aws.cloud2.influxdata.com"]

  # Token de autenticación de escritura (Debe configurarse de forma segura o inyectarse con variables de entorno de Telegraf)
  token = "$INFLUX_TOKEN"

  # Organización y Bucket correspondientes
  organization = "tu-organizacion"
  bucket = "tu-bucket"
  
  # Timeout para la petición de escritura HTTP
  timeout = "20s"
